# dsh-memory-bundle patch layer.
# Applied after the dsh-base insert; rows here override base rows by id.
#
# Disables the base plain unicode61 session-query provider and the base
# compaction backend, then inserts the dsh-memory plugin set. No database
# paths live here: every plugin defaults to $DSH_HOME/<name>.db when `path`
# is omitted, so this layer stays profile-agnostic and any number of profiles
# can share it. To isolate one profile, override config.path by id in
# ~/.dsh/profiles/<name>/cordis.patch.yml — it applies after every bundle.

- id: session-query-sqlite
  disabled: true

- id: compaction-basic
  disabled: true

- insert:
    - id: session-query-sqlite-cjk
      name: dsh-session-query-sqlite-cjk
      config:
        openAt: first-search

    - id: tool-result-dedup
      name: dsh-tool-result-dedup
      config:
        maxCacheBytes: 131072

    - id: memory-index
      name: dsh-memory-index
      config:
        embedder:
          kind: char-overlap
        dims: 512

    - id: memory-tool
      name: dsh-memory-tool

    - id: compaction-locator
      name: dsh-compaction-locator

    - id: memory-core
      name: dsh-memory-core

    - id: memory-skills
      name: dsh-memory-skills
