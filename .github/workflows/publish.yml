name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@12.10.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check:publish
      - name: Build standalone bundle
        run: |
          version=$(node -p "require('./packages/dsh-memory-bundle/package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
          node scripts/pack-release.mjs
      - name: Publish versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            .dsh-verify/release/*.tgz .dsh-verify/release/SHA256SUMS \
            --verify-tag --generate-notes --title "DSH Memory Plus $GITHUB_REF_NAME"
