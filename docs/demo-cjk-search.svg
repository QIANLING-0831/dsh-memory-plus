<text class="l0" x="16" y="44" fill="#e2e8f0" xml:space="preserve">dsh-memory-plus · CJK session search, real engine, in-memory index</text>
<text class="l1" x="16" y="61" fill="#e2e8f0" xml:space="preserve">═══════════════════════════════════════════════════════════════════════</text>
<text class="l2" x="16" y="78" fill="#e2e8f0" xml:space="preserve">indexed session log:</text>
<text class="l3" x="16" y="95" fill="#e2e8f0" xml:space="preserve">   seq0  user/message   帮我看看 OpenRouter 的免费视觉模型，顺便优化一下记忆检索</text>
<text class="l4" x="16" y="112" fill="#e2e8f0" xml:space="preserve">   seq1  assistant      建议用 FTS5 trigram tokenizer</text>
<text class="l5" x="16" y="129" fill="#e2e8f0" xml:space="preserve">      修复中文分词问题，索引优化后Token消耗也能降下来</text>
<text class="l6" x="16" y="146" fill="#e2e8f0" xml:space="preserve">   seq2  tool/result    SELECT * FROM persisted_docs WHERE 索引优化 MATCH ?</text>
<text class="l7" x="16" y="163" fill="#e2e8f0" xml:space="preserve"> </text>
<text class="l8" x="16" y="180" fill="#7dd3fc" xml:space="preserve">query &quot;索引优化&quot;      2 hits   4 CJK chars                       → trigram index</text>
<text class="l9" x="16" y="197" fill="#a3e635" xml:space="preserve">      seq 2  SELECT * FROM persisted_docs WHERE 索引优化 MATCH ?</text>
<text class="l10" x="16" y="214" fill="#a3e635" xml:space="preserve">      seq 1  建议用 FTS5 trigram tokenizer 修复中文分词问题，索引优化后Token消耗也能降下来</text>
<text class="l11" x="16" y="231" fill="#7dd3fc" xml:space="preserve">query &quot;Token消耗&quot;     1 hit    mixed CJK + ASCII                 → trigram index</text>
<text class="l12" x="16" y="248" fill="#a3e635" xml:space="preserve">      seq 1  建议用 FTS5 trigram tokenizer 修复中文分词问题，索引优化后Token消耗也能降下来</text>
<text class="l13" x="16" y="265" fill="#7dd3fc" xml:space="preserve">query &quot;OpenRouter&quot;    1 hit    ASCII only                        → unicode61 index (upstream path)</text>
<text class="l14" x="16" y="282" fill="#a3e635" xml:space="preserve">      seq 0  帮我看看 OpenRouter 的免费视觉模型，顺便优化一下记忆检索</text>
<text class="l15" x="16" y="299" fill="#7dd3fc" xml:space="preserve">query &quot;消耗&quot;          1 hit    2 CJK chars, cannot form a trigram → LIKE fallback</text>
<text class="l16" x="16" y="316" fill="#a3e635" xml:space="preserve">      seq 1  建议用 FTS5 trigram tokenizer 修复中文分词问题，索引优化后Token消耗也能降下来</text>
<text class="l17" x="16" y="333" fill="#7dd3fc" xml:space="preserve">query &quot;优&quot;            3 hits   1 CJK char                        → LIKE fallback</text>
<text class="l18" x="16" y="350" fill="#a3e635" xml:space="preserve">      seq 0  帮我看看 OpenRouter 的免费视觉模型，顺便优化一下记忆检索</text>
<text class="l19" x="16" y="367" fill="#a3e635" xml:space="preserve">      seq 2  SELECT * FROM persisted_docs WHERE 索引优化 MATCH ?</text>
<text class="l20" x="16" y="384" fill="#a3e635" xml:space="preserve">      seq 1  建议用 FTS5 trigram tokenizer 修复中文分词问题，索引优化后Token消耗也能降下来</text>
<text class="l21" x="16" y="401" fill="#7dd3fc" xml:space="preserve">query &quot;量子计算&quot;      0 hits   absent from the log               → no hits</text>
<text class="l22" x="16" y="418" fill="#e2e8f0" xml:space="preserve"> </text>
<text class="l23" x="16" y="435" fill="#e2e8f0" xml:space="preserve">notes:</text>
<text class="l24" x="16" y="452" fill="#e2e8f0" xml:space="preserve">  · ASCII queries take the untouched unicode61 table — upstream behaviour, byte for byte.</text>
<text class="l25" x="16" y="469" fill="#e2e8f0" xml:space="preserve">  · CJK queries of 3+ chars go to the trigram table; 1–2 char CJK queries fall back to an</text>
<text class="l26" x="16" y="486" fill="#e2e8f0" xml:space="preserve">    escaped LIKE scan, because a trigram index contains no 1- or 2-character gram at all.</text>
<text class="l27" x="16" y="503" fill="#e2e8f0" xml:space="preserve">  · Reproduce: node scripts/demo-cjk-search.mjs</text>
